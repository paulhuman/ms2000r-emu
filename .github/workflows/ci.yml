name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (VS2022, VST3)
        run: cmake -S . -B build -DMS2K_BUILD_VST3=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build shim (VST3_multi bundle) + host test
        run: cmake --build build --config Release --target MS2000R_Shim MS2000R_HostTest --parallel

      - name: Stage bundle for artifact (keep MS2000R.vst3/ root)
        shell: pwsh
        run: |
          $stage = 'dist/_ci_bundle'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Split-Path $stage) | Out-Null
          Copy-Item -Recurse 'build/VST3_multi/MS2000R.vst3' (Join-Path $stage 'MS2000R.vst3')

      - name: Upload VST3 bundle (debugging)
        uses: actions/upload-artifact@v7
        with:
          name: vst3-win64-ci
          path: dist/_ci_bundle
