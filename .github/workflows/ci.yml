name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (VS2022, VST3)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMS2K_BUILD_VST3=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build shim (VST3_multi bundle) + host test
        run: cmake --build build --config Release --target MS2000R_Shim MS2000R_HostTest --parallel

      - name: Upload VST3 bundle (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: vst3-win64-ci
          path: build/VST3_multi/MS2000R.vst3
